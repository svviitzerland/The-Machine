<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Machine</title>
<style>
  :root {
    --bg: #0b0c0e; --card: #15171b; --card-2: #1b1e23; --line: #25292f; --line-2: #31363e;
    --text: #e4e6e9; --muted: #8b929c; --faint: #5b626c; --accent: #f5b400;
    --person: #e4e6e9; --stranger: #6aa6ff; --object: #4fd1c5; --fact: #b39cff; --word: #5b626c;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  canvas.grab { cursor: grab; } canvas.grabbing { cursor: grabbing; } canvas.point { cursor: pointer; }
  [hidden] { display: none !important; }

  .float { position: fixed; background: var(--card); border: 1px solid var(--line); border-radius: 14px; z-index: 5; }

  nav { top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
        padding: 4px; border-radius: 999px; }
  nav .brand { font-weight: 600; font-size: 13px; letter-spacing: .02em; padding: 0 12px 0 10px; display: flex;
               align-items: center; gap: 8px; color: var(--text); }
  nav .live { width: 7px; height: 7px; border-radius: 50%; background: #34d27b; }
  nav button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font); padding: 7px 14px;
               border-radius: 999px; cursor: pointer; }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }

  .zoom { right: 16px; bottom: 16px; display: flex; flex-direction: column; padding: 4px; border-radius: 12px; }
  .zoom button { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px;
                 font: 16px var(--font); cursor: pointer; }
  .zoom button:hover { background: var(--card-2); color: var(--text); }

  #tip { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; min-width: 180px; max-width: 300px;
         padding: 10px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line-2);
         font-size: 12.5px; will-change: transform; }
  #tip h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  #tip .sub { color: var(--muted); margin: -4px 0 8px; font-size: 12px; }
  #tip dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
  #tip dt { color: var(--muted); } #tip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  .legend { left: 16px; bottom: 16px; display: flex; gap: 14px; padding: 9px 14px; font-size: 12px; color: var(--muted); border-radius: 12px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; z-index: 1;
           font-size: 14px; text-align: center; }

  /* network composer */
  .composer { left: 50%; bottom: 16px; transform: translateX(-50%); width: min(820px, calc(100vw - 120px)); padding: 10px;
              border-radius: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tokens { display: flex; gap: 4px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
  .tokens::-webkit-scrollbar { display: none; }
  .tok { flex: none; font: 12px var(--mono); padding: 3px 6px 5px; border-radius: 6px; background: var(--card-2); color: var(--muted);
         cursor: pointer; white-space: pre; position: relative; border: 1px solid transparent; }
  .tok::after { content: ""; position: absolute; left: 5px; right: 5px; bottom: 2px; height: 2px; border-radius: 2px;
                background: var(--muted); opacity: var(--a, .2); }
  .tok.said { color: var(--text); }
  .tok.special { color: var(--faint); }
  .tok.reply { color: var(--accent); }
  .tok.sel { border-color: var(--accent); background: #2a2410; }
  .thought { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .thought .act { font: 12px var(--mono); color: var(--accent); background: #2a2410; padding: 1px 7px; border-radius: 6px; }
  .thought .say { color: var(--text); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
               padding: 10px 12px; font: 14px var(--font); outline: none; }
  .row input:focus { border-color: var(--line-2); }
  .btn { border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); border-radius: 10px; padding: 0 14px;
         font: 500 13px var(--font); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #141100; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .note { font-size: 12.5px; color: var(--muted); padding: 0 4px; }

  /* live */
  #liveview { position: fixed; inset: 0; }
  .stage { position: absolute; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage .off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .chat { right: 16px; top: 72px; bottom: 16px; width: 320px; display: flex; flex-direction: column; overflow: hidden; }
  .chat h3 { margin: 0; padding: 14px 16px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .msgs { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px;
          scrollbar-width: none; }
  .msgs::-webkit-scrollbar { display: none; }
  .msg { max-width: 88%; font-size: 13.5px; line-height: 1.45; }
  .msg.you { align-self: flex-end; background: var(--card-2); border: 1px solid var(--line); padding: 7px 11px;
             border-radius: 12px 12px 4px 12px; color: var(--text); }
  .msg.it { align-self: flex-start; color: var(--text); }
  .msg.it::before { content: "Machine"; display: block; font-size: 11.5px; color: var(--accent); margin-bottom: 2px; }
  .msgs .none { color: var(--faint); font-size: 13px; margin: auto; text-align: center; }
  .talk { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 0 2px; }
  .state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .state[data-s="thinking"] .dot { background: var(--accent); animation: pulse 1s infinite; }
  .state[data-s="speaking"] .dot { background: #fff; animation: pulse .5s infinite; }
  .state[data-s="hearing"] .dot { background: var(--stranger); }
  .state[data-s="listening"] .dot { background: #34d27b; }
  .meter { display: flex; gap: 2px; align-items: center; height: 14px; margin-left: auto; }
  .meter i { width: 3px; border-radius: 2px; background: var(--line-2); height: 4px; transition: height .08s; }
  @keyframes pulse { 50% { opacity: .35; } }
  .drives { left: 16px; bottom: 16px; padding: 12px 14px; display: grid; grid-template-columns: auto 90px; gap: 6px 12px;
            align-items: center; font-size: 12px; color: var(--muted); }
  .drives b { display: block; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .drives b i { display: block; height: 100%; background: var(--text); width: 0; transition: width .4s; }
  .drives b.c i { background: var(--accent); }
</style>
</head>
<body>
<canvas id="canvas" class="grab"></canvas>

<nav class="float" role="tablist">
  <span class="brand"><span class="live" id="awake" hidden title="awake"></span>The Machine</span>
  <button role="tab" data-view="live" aria-selected="false" hidden>Live</button>
  <button role="tab" data-view="memory" aria-selected="true">Memory</button>
  <button role="tab" data-view="network" aria-selected="false">Network</button>
</nav>

<div class="float zoom">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="zfit" title="Fit to screen">⤢</button>
</div>

<div class="float legend" id="legend"></div>

<div class="float composer" id="composer" hidden>
  <div class="tokens" id="tokens" hidden></div>
  <div class="thought" id="thought" hidden></div>
  <div class="note" id="note" hidden></div>
  <div class="row">
    <button class="btn" id="play" hidden>Play</button>
    <input id="say" placeholder="Say something and watch it think" autocomplete="off" spellcheck="false">
    <button class="btn" id="livebtn" hidden>Live</button>
    <button class="btn primary" id="go">Think</button>
  </div>
</div>

<section id="liveview" hidden>
  <div class="stage" id="stage" role="img" aria-label="What the Machine sees">
    <img id="video" alt="">
    <canvas id="overlay"></canvas>
    <div class="off" id="off" hidden>Waiting for the camera…</div>
  </div>
  <aside class="float chat">
    <h3>Conversation</h3>
    <div class="msgs" id="msgs"><div class="none">Say something, or type below.</div></div>
    <div class="talk">
      <div class="state" id="state" data-s="typing"><span class="dot"></span><span id="statelabel">Ready</span>
        <span class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      <div class="row"><input id="talk" placeholder="Talk to it" autocomplete="off"><button class="btn primary" id="send">Send</button></div>
    </div>
  </aside>
  <div class="float drives">
    <span>Curiosity</span><b class="c"><i id="d-curiosity"></i></b>
    <span>Social</span><b><i id="d-social"></i></b>
    <span>Energy</span><b><i id="d-energy"></i></b>
    <span id="head-row" hidden>Head</span><span id="d-head" hidden></span>
  </div>
</section>

<div class="empty" id="empty" hidden></div>
<div id="tip" hidden></div>

<script type="module">
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const C = { self: '#ffffff', maker: css('--accent'), person: css('--person'), stranger: css('--stranger'),
            object: css('--object'), fact: css('--fact'), word: css('--word'), line: css('--line'),
            line2: css('--line-2'), muted: css('--muted'), faint: css('--faint'), accent: css('--accent') };
const KIND = { maker: 'made it', person: 'person', stranger: 'face without a name', object: 'thing', fact: 'fact', word: 'word' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- canvas, camera, render loop ---------- */
const canvas = $('#canvas'), ctx = canvas.getContext('2d');
let W = 0, H = 0, view = 'memory', dirty = true;
const cams = { memory: { x: 0, y: 0, k: 1 }, network: { x: 0, y: 0, k: 1 } };
const cam = () => cams[view];
const sx = x => x * cam().k + cam().x, sy = y => y * cam().k + cam().y;
const wx = x => (x - cam().x) / cam().k, wy = y => (y - cam().y) / cam().k;
const redraw = () => { dirty = true; };

function resize() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * d; canvas.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  redraw();
}
addEventListener('resize', resize);

function zoomAt(f, mx = W / 2, my = H / 2) {
  const c = cam(), px = wx(mx), py = wy(my);
  c.k = Math.min(14, Math.max(0.1, c.k * f));
  c.x = mx - px * c.k; c.y = my - py * c.k;
  redraw();
}
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY); },
                        { passive: false });
$('#zin').onclick = () => zoomAt(1.3);
$('#zout').onclick = () => zoomAt(1 / 1.3);
$('#zfit').onclick = () => fit();
function fit() { (view === 'memory' ? fitMemory : fitNet)(); redraw(); }

function loop() {
  if (view === 'live') { drawLive(); return requestAnimationFrame(loop); }
  const moving = view === 'memory' ? stepMemory() : false;
  if (dirty || moving || (view === 'memory' && M.active.size)) {
    dirty = false;
    ctx.clearRect(0, 0, W, H);
    view === 'memory' ? drawMemory() : drawNet();
  }
  requestAnimationFrame(loop);
}

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(x, y, html) {
  if (tip.dataset.html !== html) { tip.innerHTML = html; tip.dataset.html = html; }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const tx = x + 16 + w > W ? x - w - 12 : x + 16, ty = Math.min(y + 16, H - h - 8);
  tip.style.transform = `translate(${tx}px, ${ty}px)`;
}
function hideTip() { tip.hidden = true; }
const dl = obj => '<dl>' + Object.entries(obj).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>';

/* ---------- pointer: pan, drag, hover, click ---------- */
let press = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const hit = view === 'memory' ? nodeAt(e.clientX, e.clientY) : null;
  press = { x: e.clientX, y: e.clientY, last: [e.clientX, e.clientY], node: hit, moved: false };
  canvas.className = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (press) {
    const dx = e.clientX - press.last[0], dy = e.clientY - press.last[1];
    press.last = [e.clientX, e.clientY];
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4) press.moved = true;
    if (!press.moved) return;
    if (press.node && press.node.id !== 'self') {
      press.node.x = wx(e.clientX); press.node.y = wy(e.clientY); press.node.pinned = true; M.heat = Math.max(M.heat, .25);
    } else if (!press.node) { cam().x += dx; cam().y += dy; }
    redraw();
    if (press.node) hover(e.clientX, e.clientY);
    return;
  }
  hover(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  const p = press; press = null;
  canvas.className = 'grab';
  if (p && !p.moved && view === 'memory') M.focus = p.node && M.focus !== p.node ? p.node : null;
  hover(e.clientX, e.clientY);
  redraw();
});
canvas.addEventListener('pointerleave', () => { if (!press) { setHover(null); hideTip(); } });
canvas.addEventListener('dblclick', () => fit());

function hover(x, y) {
  if (view === 'memory') {
    const n = nodeAt(x, y);
    setHover(n);
    canvas.className = press ? 'grabbing' : n ? 'point' : 'grab';
    n ? showTip(x, y, nodeTip(n)) : hideTip();
  } else {
    const n = neuronAt(x, y);
    setHover(n);
    n ? showTip(x, y, neuronTip(n)) : hideTip();
  }
}
let hovered = null;
function setHover(h) {
  const same = h === hovered || (h && hovered && h.i === hovered.i && h.j === hovered.j && h.i !== undefined);
  if (!same) { hovered = h; redraw(); }
}

/* ---------- memory ---------- */
const M = { nodes: [], edges: [], by: {}, adj: new Map(), active: new Set(), heat: 0, focus: null, fitted: false };
const radius = n => (3 + 2.4 * n.size) * Math.min(1.6, Math.sqrt(cams.memory.k));

$('#legend').innerHTML = Object.entries(KIND).map(([k, t]) => `<span><i style="background:${C[k]}"></i>${t}</span>`).join('');

async function loadMemory() {
  let d;
  try { d = await (await fetch('/api/memory')).json(); } catch { return; }
  $('#awake').hidden = !d.live;
  const by = {};
  for (const n of d.nodes) {
    const o = M.by[n.id];
    by[n.id] = o ? Object.assign(o, n) : Object.assign(n, { x: NaN, y: NaN, vx: 0, vy: 0 });
  }
  const edges = d.edges.filter(([a, b]) => by[a] && by[b]).map(([a, b, w]) => ({ a: by[a], b: by[b], w }));
  const adj = new Map(d.nodes.map(n => [by[n.id], new Set()]));
  for (const e of edges) { adj.get(e.a).add(e.b); adj.get(e.b).add(e.a); }
  let added = 0;
  for (const e of edges) if (isNaN(e.b.x)) {
    const a = isNaN(e.a.x) ? { x: 0, y: 0 } : e.a, ang = Math.random() * 6.28;
    e.b.x = a.x + Math.cos(ang) * 60; e.b.y = a.y + Math.sin(ang) * 60; added++;
  }
  if (by.self) { by.self.x = 0; by.self.y = 0; by.self.pinned = true; }
  for (const n of Object.values(by)) if (isNaN(n.x)) { n.x = (Math.random() - .5) * 200; n.y = (Math.random() - .5) * 200; }
  M.nodes = d.nodes.map(n => by[n.id]); M.edges = edges; M.by = by; M.adj = adj; M.active = new Set(d.active);
  if (added || edges.length !== M.edgeCount) M.heat = 1;
  M.edgeCount = edges.length;
  if (!M.fitted) { for (let i = 0; i < 300 && stepMemory(); i++); fitMemory(); M.fitted = true; }
  $('#empty').hidden = view !== 'memory' || M.nodes.length > 1;
  $('#empty').textContent = 'Nothing learned yet. Show it a face or a thing and tell it what it is.';
  redraw();
}

function stepMemory() {
  const N = M.nodes, n = N.length;
  if (M.heat < 0.004 || n < 2) return false;
  for (let i = 0; i < n; i++) {
    const a = N[i];
    for (let j = i + 1; j < n; j++) {
      const b = N[j]; let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy + 40;
      if (d2 > 160000) continue;
      const f = 2400 / d2, inv = 1 / Math.sqrt(d2); dx *= inv * f; dy *= inv * f;
      a.vx -= dx; a.vy -= dy; b.vx += dx; b.vy += dy;
    }
  }
  for (const e of M.edges) {
    const rest = e.a.id === 'self' ? 140 : 64;
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y; const d = Math.hypot(dx, dy) + .01;
    const f = (d - rest) * 0.04 * (0.5 + e.w) / d; dx *= f; dy *= f;
    e.a.vx += dx; e.a.vy += dy; e.b.vx -= dx; e.b.vy -= dy;
  }
  for (const p of N) {
    if (p.pinned || p === press?.node) { p.vx = p.vy = 0; continue; }
    p.vx = (p.vx - p.x * 0.002) * 0.55; p.vy = (p.vy - p.y * 0.002) * 0.55;
    p.x += Math.max(-24, Math.min(24, p.vx * M.heat)); p.y += Math.max(-24, Math.min(24, p.vy * M.heat));
  }
  M.heat *= 0.98;
  return true;
}

function fitMemory() {
  if (!M.nodes.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const n of M.nodes) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); }
  const c = cams.memory, k = Math.min(2.2, Math.min((W - 160) / (x1 - x0 + 1), (H - 200) / (y1 - y0 + 1)));
  c.k = k; c.x = W / 2 - (x0 + x1) / 2 * k; c.y = H / 2 + 10 - (y0 + y1) / 2 * k;
}

function nodeAt(x, y) {
  let best = null, bd = Infinity;
  for (const n of M.nodes) {
    const d = Math.hypot(sx(n.x) - x, sy(n.y) - y);
    if (d < Math.max(10, radius(n) + 6) && d < bd) { best = n; bd = d; }
  }
  return best;
}

function nodeTip(n) {
  const info = Object.assign({}, n.info || {});
  const what = info.what; delete info.what;
  const links = M.adj.get(n)?.size || 0;
  if (n.kind !== 'self') info.links = links;
  return `<h4>${esc(n.kind === 'self' ? n.label : n.label)}</h4>${what ? `<div class="sub">${esc(what)}</div>` : ''}${dl(info)}`;
}

function drawMemory() {
  const t = performance.now() / 1000, k = cams.memory.k;
  const focus = (press?.node) || (hovered && hovered.id ? hovered : null) || M.focus;
  const near = focus ? M.adj.get(focus) : null;
  const lit = n => !focus || n === focus || near.has(n);
  // edges: dim ones in one path, lit ones in another
  ctx.lineWidth = 1;
  ctx.strokeStyle = focus ? '#16191d' : C.line2;
  ctx.beginPath();
  for (const e of M.edges) if (!(focus && lit(e.a) && lit(e.b) && (e.a === focus || e.b === focus))) {
    ctx.moveTo(sx(e.a.x), sy(e.a.y)); ctx.lineTo(sx(e.b.x), sy(e.b.y));
  }
  ctx.stroke();
  if (focus) {
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.3; ctx.beginPath();
    for (const e of M.edges) if (e.a === focus || e.b === focus) { ctx.moveTo(sx(e.a.x), sy(e.a.y)); ctx.lineTo(sx(e.b.x), sy(e.b.y)); }
    ctx.stroke();
  }
  // nodes
  for (const n of M.nodes) {
    const x = sx(n.x), y = sy(n.y), r = radius(n);
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
    ctx.globalAlpha = lit(n) ? 1 : 0.2;
    ctx.fillStyle = C[n.kind] || C.object;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    if (n.kind === 'self') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 6.283); ctx.stroke(); }
    if (n === focus) { ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 6.283); ctx.stroke(); }
    if (M.active.has(n.id)) {
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4);
      ctx.beginPath(); ctx.arc(x, y, r + 7, 0, 6.283); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // labels last, so they sit on top
  ctx.textBaseline = 'middle';
  for (const n of M.nodes) {
    const show = n.kind !== 'word' || k > 1.4 || (focus && lit(n));
    if (!show) continue;
    const x = sx(n.x), y = sy(n.y);
    if (x < -40 || y < -40 || x > W + 200 || y > H + 40) continue;
    ctx.font = n.kind === 'self' ? `600 13px ${css('--font')}` : `12px ${css('--font')}`;
    ctx.fillStyle = n === focus ? '#fff' : lit(n) ? (n.kind === 'self' ? '#fff' : '#b9bfc7') : '#3a4048';
    ctx.fillText(n.kind === 'self' ? n.label.toUpperCase() : n.label, x + radius(n) + 7, y);
  }
}

/* ---------- network ---------- */
const COL = 64, ROW = 10;
const N = { d: null, t: 0, playing: null, live: false, timer: null, brain: null };

function b64(s, T) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); }

function load(r) {
  const act = b64(r.act, Uint8Array), L = r.layers, G = r.groups, T = act.length / (L * G);
  const order = new Array(T * L), rank = new Uint8Array(T * L * G), best = new Uint16Array(T * L), mean = new Float32Array(T);
  for (let t = 0; t < T; t++) {
    let m = 0;
    for (let i = 0; i < L; i++) {
      const base = (t * L + i) * G, o = Array.from({ length: G }, (_, j) => j).sort((p, q) => act[base + q] - act[base + p]);
      order[t * L + i] = o; best[t * L + i] = o[0];
      o.forEach((j, r) => { rank[base + j] = r; });
      for (let j = 0; j < G; j++) m += act[base + j];
    }
    mean[t] = m / (L * G * 255);
  }
  const mx = Math.max(...mean, 1e-6);
  return { T, L, G, width: r.width, act, order, rank, best, mean: mean.map(v => v / mx),
           scale: b64(r.scale, Float32Array), idx: b64(r.idx, Uint16Array),
           words: r.tokens || [], said: r.said ?? T, reply: r.reply || '' };
}

function fitNet() {
  const d = N.d || { L: N.brain?.layers || 24, G: 64 };
  const w = (d.L - 1) * COL, h = (d.G - 1) * ROW, c = cams.network;
  const top = 92, bottom = composerHeight() + 40;
  c.k = Math.min((W - 140) / w, (H - top - bottom) / h);
  c.x = (W - w * c.k) / 2; c.y = top + (H - top - bottom - h * c.k) / 2;
}
const composerHeight = () => $('#composer').offsetHeight || 60;
const A = (t, i, j) => N.d.act[(t * N.d.L + i) * N.d.G + j] / 255;

function drawNet() {
  const d = N.d;
  if (!d) return drawSkeleton();
  const t = N.t, k = cams.network.k, h = hovered && hovered.i !== undefined ? hovered : null;
  const X = i => sx(i * COL), Y = j => sy(j * ROW);
  const r = Math.max(1.3, Math.min(4.5, 2.4 * Math.sqrt(k)));
  // links between the strongest neurons of neighbouring layers, batched by strength
  const buckets = [[], [], [], []], hot = [];
  for (let i = 0; i < d.L - 1; i++) {
    const A1 = d.order[t * d.L + i].slice(0, 6), B1 = d.order[t * d.L + i + 1].slice(0, 6);
    for (const a of A1) for (const b of B1) {
      const s = Math.sqrt(A(t, i, a) * A(t, i + 1, b));
      const seg = [X(i), Y(a), X(i + 1), Y(b)];
      if (h && ((h.i === i && h.j === a) || (h.i === i + 1 && h.j === b))) hot.push(seg);
      else buckets[Math.min(3, Math.floor(s * 4))].push(seg);
    }
  }
  ctx.lineWidth = 1;
  buckets.forEach((segs, q) => {
    ctx.strokeStyle = `rgba(245,180,0,${(h ? 0.03 : 0.05) + (h ? 0.04 : 0.11) * q})`;
    ctx.beginPath(); for (const [a, b, c, e] of segs) { ctx.moveTo(a, b); ctx.lineTo(c, e); } ctx.stroke();
  });
  if (hot.length) {
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4;
    ctx.beginPath(); for (const [a, b, c, e] of hot) { ctx.moveTo(a, b); ctx.lineTo(c, e); } ctx.stroke();
  }
  // neurons batched into brightness levels
  const levels = Array.from({ length: 8 }, () => []);
  for (let i = 0; i < d.L; i++) {
    const x = X(i);
    if (x < -10 || x > W + 10) continue;
    const top = d.best[t * d.L + i];
    for (let j = 0; j < d.G; j++) {
      if (j === top) continue;
      levels[Math.min(7, Math.floor(A(t, i, j) * 8))].push(x, Y(j));
    }
  }
  levels.forEach((pts, q) => {
    ctx.fillStyle = `rgba(228,230,233,${0.14 + 0.12 * q})`;
    ctx.beginPath();
    for (let p = 0; p < pts.length; p += 2) { ctx.moveTo(pts[p] + r, pts[p + 1]); ctx.arc(pts[p], pts[p + 1], r, 0, 6.283); }
    ctx.fill();
  });
  ctx.fillStyle = C.accent; ctx.beginPath();
  for (let i = 0; i < d.L; i++) { const j = d.best[t * d.L + i], x = X(i), y = Y(j); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.283); }
  ctx.fill();
  if (h) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X(h.i), Y(h.j), r + 3, 0, 6.283); ctx.stroke();
  }
  labels(d.L);
}

function drawSkeleton() {
  const L = N.brain?.layers;
  if (!L) return;
  const r = Math.max(1.2, Math.min(3.5, 2 * Math.sqrt(cams.network.k)));
  ctx.fillStyle = '#23272d'; ctx.beginPath();
  for (let i = 0; i < L; i++) for (let j = 0; j < 64; j++) {
    const x = sx(i * COL), y = sy(j * ROW); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.283);
  }
  ctx.fill();
  labels(L);
}

function labels(L) {
  ctx.fillStyle = C.faint; ctx.font = `11px ${css('--font')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const every = cams.network.k < 0.45 ? 4 : cams.network.k < 0.8 ? 2 : 1;
  for (let i = 0; i < L; i++) if (i % every === 0 || i === L - 1) ctx.fillText(`L${i + 1}`, sx(i * COL), sy(0) - 14);
  ctx.textAlign = 'left';
}

function neuronAt(x, y) {
  const d = N.d; if (!d) return null;
  const i = Math.round(wx(x) / COL), j = Math.round(wy(y) / ROW);
  if (i < 0 || i >= d.L || j < 0 || j >= d.G) return null;
  const tol = Math.max(7, ROW * cams.network.k * 0.6);
  return Math.abs(sx(i * COL) - x) < tol && Math.abs(sy(j * ROW) - y) < tol ? { i, j } : null;
}

function neuronTip(n) {
  const d = N.d, t = N.t, g = d.width / d.G, base = (t * d.L + n.i) * d.G + n.j;
  return `<h4>Layer ${n.i + 1} · block ${n.j + 1}</h4><div class="sub">${esc(tokenLabel(d.words[t] ?? ''))}</div>` + dl({
    'neurons': `${n.j * g}–${(n.j + 1) * g - 1}`,
    'strongest': `N${d.idx[base]}`,
    'activation': (A(t, n.i, n.j) * d.scale[t * d.L + n.i]).toFixed(3),
    'rank in layer': `${d.rank[base] + 1} of ${d.G}`,
  });
}

const tokenLabel = w => w.replace(/\n/g, '⏎').replace(/^ /, '·') || '∅';
const special = w => /^<\|.*\|>$|^<\/?think>$/.test(w) || w === '\n';

function renderTokens() {
  const d = N.d, box = $('#tokens');
  box.hidden = d.T < 2;
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  d.words.forEach((w, i) => {
    const el = document.createElement('span');
    el.className = 'tok ' + (special(w) ? 'special' : i < d.said ? 'said' : 'reply');
    el.textContent = tokenLabel(w);
    el.style.setProperty('--a', (0.15 + 0.85 * d.mean[i]).toFixed(2));
    el.dataset.i = i;
    frag.appendChild(el);
  });
  box.appendChild(frag);
}
$('#tokens').addEventListener('pointerover', e => { const i = e.target.dataset?.i; if (i !== undefined && !N.playing) select(+i, false); });
$('#tokens').addEventListener('wheel', e => {          // a normal scroll wheel moves the row sideways
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); $('#tokens').scrollLeft += e.deltaY; }
}, { passive: false });
$('#tokens').addEventListener('click', e => { const i = e.target.dataset?.i; if (i !== undefined) select(+i); });

function select(t, scroll = true) {
  if (!N.d) return;
  t = Math.max(0, Math.min(N.d.T - 1, t));
  const toks = $('#tokens').children;
  toks[N.t]?.classList.remove('sel'); toks[t]?.classList.add('sel');
  if (scroll) toks[t]?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  N.t = t; redraw();
  if (hovered && hovered.i !== undefined) showTip(lastMouse[0], lastMouse[1], neuronTip(hovered));
}
let lastMouse = [0, 0];
addEventListener('pointermove', e => { lastMouse = [e.clientX, e.clientY]; });

function showThought(raw) {
  const box = $('#thought');
  let data = null;
  try { data = JSON.parse(raw); } catch { /* cut off: read what we can */ }
  const acts = data ? data.actions || [] : [...raw.matchAll(/"do":\s*"(\w+)"(?:[^}]*?"name":\s*"([^"]*)")?/g)].map(m => ({ do: m[1], name: m[2] }));
  const say = data ? data.reply : (raw.match(/"reply":\s*"((?:[^"\\]|\\.)*)/) || [])[1];
  box.innerHTML = acts.map(a => `<span class="act">${esc(a.do.replace(/_/g, ' '))}${a.name || a.subject ? ': ' + esc(a.name || a.subject) : ''}</span>`).join('')
    + (say ? `<span class="say">“${esc(say)}”</span>` : acts.length ? '' : '<span>stays quiet</span>');
  box.hidden = false;
}

function note(text) { const n = $('#note'); n.textContent = text || ''; n.hidden = !text; }

async function think() {
  const text = $('#say').value.trim(); if (!text) return $('#say').focus();
  stopLive(); stopPlay();
  const go = $('#go'); go.disabled = true; go.textContent = 'Thinking…';
  note(N.brain && !N.brain.loaded ? 'Waking the cortex up, this takes a moment the first time.' : '');
  try {
    const r = await (await fetch('/api/trace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })).json();
    if (r.error) return note(r.error);
    note('');
    N.d = load(r);
    if (N.brain) N.brain.loaded = true;
    renderTokens(); showThought(r.reply);
    $('#play').hidden = false; $('#empty').hidden = true;
    requestAnimationFrame(() => { fitNet(); N.t = -1; select(N.d.said); });
  } catch { note('Could not reach the Machine.'); }
  finally { go.disabled = false; go.textContent = 'Think'; }
}

function stopPlay() { clearInterval(N.playing); N.playing = null; $('#play').textContent = 'Play'; }
function play() {
  if (!N.d) return;
  if (N.playing) return stopPlay();
  if (N.t >= N.d.T - 1) select(0);
  $('#play').textContent = 'Pause';
  N.playing = setInterval(() => N.t >= N.d.T - 1 ? stopPlay() : select(N.t + 1), 120);
}

function stopLive() { N.live = false; clearInterval(N.timer); $('#livebtn').classList.remove('on'); }
function toggleLive() {
  if (N.live) return stopLive();
  stopPlay(); N.live = true; $('#livebtn').classList.add('on'); $('#tokens').hidden = true; $('#empty').hidden = true;
  N.timer = setInterval(async () => {
    try {
      const r = await (await fetch('/api/live')).json();
      if (!r.act) return note('Nothing to watch yet.');
      N.d = load(Object.assign(r, { tokens: [] })); N.t = 0; redraw();
      if (r.thinking) showThought(r.text.slice(r.text.indexOf('{'))); else note('Resting. It lights up while it thinks.');
    } catch { stopLive(); }
  }, 150);
}

$('#go').onclick = think;
$('#play').onclick = play;
$('#livebtn').onclick = toggleLive;
$('#say').addEventListener('keydown', e => { if (e.key === 'Enter') think(); });
addEventListener('keydown', e => {
  if (view !== 'network' || document.activeElement === $('#say') || !N.d) return;
  if (e.key === 'ArrowRight') { stopPlay(); select(N.t + 1); }
  if (e.key === 'ArrowLeft') { stopPlay(); select(N.t - 1); }
  if (e.key === ' ') { e.preventDefault(); play(); }
});


/* ---------- live ---------- */
const L = { state: null, boxes: new Map(), timer: null, chatTimer: null, lastMsg: 0, rect: null };
const overlay = $('#overlay'), octx = overlay.getContext('2d');
const STATUS = { thinking: 'Thinking…', speaking: 'Speaking', hearing: 'Hearing you', listening: 'Listening', typing: 'Type to talk' };
const FACE = { maker: C.accent, person: C.person, stranger: C.stranger, unknown: '#9aa1ab' };
const WHO = { maker: 'made me', person: 'known', stranger: 'seen before', unknown: 'unknown' };

function layoutLive() {
  const st = $('#stage'), size = L.state?.size || [640, 480];
  const right = W > 1000 ? 352 : 16, top = 72, bottom = W > 1000 ? 16 : 260;
  const aw = W - 16 - right, ah = H - top - bottom, k = Math.min(aw / size[0], ah / size[1]);
  const w = size[0] * k, h = size[1] * k, x = 16 + (aw - w) / 2, y = top + (ah - h) / 2;
  Object.assign(st.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const d = devicePixelRatio || 1;
  overlay.width = w * d; overlay.height = h * d; octx.setTransform(d, 0, 0, d, 0, 0);
  L.rect = { w, h, k };
}

async function pollState() {
  try {
    const s = await (await fetch('/api/state')).json();
    const resized = !L.state || s.size[0] !== L.state.size[0] || s.size[1] !== L.state.size[1];
    L.state = s;
    if (resized) layoutLive();
    const el = $('#state'); el.dataset.s = s.status; $('#statelabel').textContent = STATUS[s.status] || s.status;
    const bars = $('#meter').children, lv = s.status === 'hearing' || s.status === 'listening' ? s.level : 0;
    for (let i = 0; i < bars.length; i++) bars[i].style.height = (4 + Math.max(0, lv * 14 - Math.abs(i - 2.5) * 2)) + 'px';
    for (const k of ['curiosity', 'social', 'energy']) $('#d-' + k).style.width = (s.drives[k] * 100).toFixed(0) + '%';
    $('#head-row').hidden = $('#d-head').hidden = !s.head;
    if (s.head) $('#d-head').textContent = s.head.connected ? `${s.head.pan}° / ${s.head.tilt}°` : 'waiting…';
    $('#off').hidden = true;
  } catch { $('#off').hidden = false; }
}

async function pollChat() {
  try {
    const rows = await (await fetch('/api/chat')).json();
    const last = rows.length ? rows[rows.length - 1].id : 0;
    if (last === L.lastMsg) return;
    L.lastMsg = last;
    const box = $('#msgs');
    box.innerHTML = rows.length ? rows.map(r => `<div class="msg ${r.who}">${esc(r.text)}</div>`).join('')
                                : '<div class="none">Say something, or type below.</div>';
    box.scrollTop = box.scrollHeight;
  } catch { /* try again next time */ }
}

function drawLive() {
  const s = L.state, r = L.rect;
  if (!s || !r) return;
  octx.clearRect(0, 0, r.w, r.h);
  const t = performance.now() / 1000, seen = new Set();
  const place = (key, box) => {              // ease each box toward where it is now, mirrored like a mirror
    const x = r.w - (box[0] + box[2]) * r.k, y = box[1] * r.k, w = box[2] * r.k, h = box[3] * r.k;
    const cur = L.boxes.get(key) || [x, y, w, h];
    const nb = cur.map((v, i) => v + ([x, y, w, h][i] - v) * 0.35);
    L.boxes.set(key, nb); seen.add(key);
    return nb;
  };
  for (const f of s.faces) {
    const [x, y, w, h] = place('f' + f.id, f.box), col = FACE[f.kind] || FACE.unknown;
    brackets(x, y, w, h, col, f.teaching ? 2.5 + Math.sin(t * 8) : 2, f.kind === 'unknown');
    pill(x, y + h + 8, f.name || (f.kind === 'stranger' ? 'Someone I keep seeing' : 'Who is this?'), WHO[f.kind], col);
  }
  for (const o of s.things) {
    const [x, y, w, h] = place('o' + o.id, o.box), col = o.teaching ? C.accent : C.object;
    brackets(x, y, w, h, col, o.teaching ? 2.5 + Math.sin(t * 8) : 1.6, !o.name && !o.teaching);
    pill(x, y - 30, o.name || (o.teaching ? 'Learning…' : 'Something new'), null, col);
  }
  for (const k of L.boxes.keys()) if (!seen.has(k)) L.boxes.delete(k);
}

function brackets(x, y, w, h, col, width, dashed) {
  const c = octx, l = Math.max(10, Math.min(w, h) * 0.22);
  c.strokeStyle = col; c.lineWidth = width; c.lineCap = 'round'; c.lineJoin = 'round';
  if (dashed) {
    c.setLineDash([5, 6]); c.globalAlpha = 0.8; c.strokeRect(x, y, w, h); c.setLineDash([]); c.globalAlpha = 1; return;
  }
  c.beginPath();
  for (const [px, py, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    c.moveTo(px + dx * l, py); c.lineTo(px, py); c.lineTo(px, py + dy * l);
  }
  c.stroke();
}

function pill(x, y, text, sub, col) {
  const c = octx;
  c.font = `600 13px ${css('--font')}`;
  const tw = c.measureText(text).width;
  c.font = `12px ${css('--font')}`;
  const sw = sub ? c.measureText(sub).width + 10 : 0, w = tw + sw + 22, h = 24;
  x = Math.max(4, Math.min(x, L.rect.w - w - 4)); y = Math.max(4, Math.min(y, L.rect.h - h - 4));
  c.fillStyle = 'rgba(11,12,14,.88)'; c.beginPath(); c.roundRect(x, y, w, h, 12); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(x + 11, y + h / 2, 3.5, 0, 6.283); c.fill();
  c.fillStyle = '#fff'; c.font = `600 13px ${css('--font')}`; c.textBaseline = 'middle'; c.fillText(text, x + 19, y + h / 2 + .5);
  if (sub) { c.fillStyle = C.muted; c.font = `12px ${css('--font')}`; c.fillText(sub, x + 19 + tw + 8, y + h / 2 + .5); }
}

async function send() {
  const box = $('#talk'), text = box.value.trim(); if (!text) return;
  box.value = '';
  try { await fetch('/api/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }); }
  catch { box.value = text; }
  setTimeout(pollChat, 150);
}
$('#send').onclick = send;
$('#talk').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function startLive() {
  $('#video').src = '/api/video?' + Date.now();
  layoutLive();
  L.timer = setInterval(pollState, 100); pollState();
  L.chatTimer = setInterval(pollChat, 700); pollChat();
}
function stopLiveView() { clearInterval(L.timer); clearInterval(L.chatTimer); $('#video').removeAttribute('src'); }
addEventListener('resize', () => { if (view === 'live') layoutLive(); });

/* ---------- views ---------- */
function show(v) {
  if (view === 'live' && v !== 'live') stopLiveView();
  view = v;
  $('#liveview').hidden = v !== 'live';
  canvas.hidden = v === 'live';
  $('.zoom').hidden = v === 'live';
  document.querySelectorAll('nav [role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
  $('#legend').hidden = v !== 'memory';
  $('#composer').hidden = v !== 'network';
  hideTip(); hovered = null;
  const empty = $('#empty');
  if (v === 'live') { empty.hidden = true; startLive(); }
  else if (v === 'memory') { empty.hidden = M.nodes.length > 1; empty.textContent = 'Nothing learned yet. Show it a face or a thing and tell it what it is.'; }
  else {
    empty.hidden = !!N.d;
    empty.textContent = N.brain?.model ? 'Type something below to watch every layer work on it.'
                                       : 'No cortex model yet. Run python -m the_machine download.';
    if (!N.fitted) { fitNet(); N.fitted = true; }
  }
  redraw();
}
document.querySelectorAll('nav [role=tab]').forEach(b => b.onclick = () => show(b.dataset.view));

async function init() {
  resize();
  requestAnimationFrame(loop);
  await loadMemory();
  try { N.brain = await (await fetch('/api/brain')).json(); } catch { N.brain = null; }
  $('#livebtn').hidden = !N.brain?.live;
  if (N.brain?.camera) { document.querySelector('[data-view=live]').hidden = false; show('live'); }
  if (N.brain?.live) setInterval(loadMemory, 2000);
}
init();
</script>
