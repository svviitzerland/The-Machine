<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Machine</title>
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --line: #262b33; --text: #d7dbe0; --dim: #7d8590;
    --accent: #f5b400; --person: #e6e8eb; --stranger: #5aa0ff; --object: #4fd1c5; --fact: #a78bfa; --word: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  header { height: 44px; display: flex; align-items: center; gap: 22px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; letter-spacing: .14em; font-size: 12px; }
  .tab { cursor: pointer; color: var(--dim); letter-spacing: .08em; font-size: 12px; height: 44px; line-height: 44px;
         border-bottom: 2px solid transparent; user-select: none; }
  .tab.on { color: var(--text); border-color: var(--accent); }
  #status { margin-left: auto; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4b5563; margin-right: 7px; vertical-align: 1px; }
  .dot.live { background: #3ecf6e; }
  main { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 9px 11px;
         border-radius: 6px; font-size: 12px; max-width: 300px; display: none; z-index: 10; }
  #tip b { display: block; margin-bottom: 5px; font-size: 13px; }
  #tip .row { display: flex; justify-content: space-between; gap: 14px; }
  #tip .k { color: var(--dim); }
  .bar { position: absolute; left: 18px; right: 18px; display: flex; gap: 8px; align-items: center; z-index: 2; }
  #netbar { top: 14px; }
  input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 9px 12px;
          border-radius: 6px; font: inherit; outline: none; }
  input:focus { border-color: #3a414c; }
  button { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 14px;
           border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { border-color: #3a414c; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #tokens { position: absolute; left: 18px; right: 18px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 3px;
            max-height: 92px; overflow: auto; z-index: 2; }
  .tok { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 5px; border-radius: 4px; background: var(--panel);
         border: 1px solid var(--line); cursor: pointer; white-space: pre; }
  .tok.reply { color: var(--accent); }
  .tok.special { color: var(--dim); }
  .tok.sel { background: var(--accent); color: #111; border-color: var(--accent); }
  #reply { position: absolute; left: 18px; right: 520px; bottom: 112px; color: var(--dim); z-index: 2;
           font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { position: absolute; right: 18px; color: var(--dim); font-size: 12px; z-index: 2; pointer-events: none; }
  #legend { position: absolute; left: 18px; bottom: 14px; color: var(--dim); font-size: 12px; display: flex; gap: 14px; z-index: 2; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim);
           pointer-events: none; }
</style>
</head>
<body>
<header>
  <span class="brand">THE MACHINE</span>
  <span class="tab on" data-view="memory">MEMORY</span>
  <span class="tab" data-view="network">NEURAL NETWORK</span>
  <span id="status"></span>
</header>
<main>
  <section class="view on" id="memory">
    <canvas id="mc"></canvas>
    <div class="hint" style="top:14px">scroll to zoom · drag to move · hover for details</div>
    <div id="legend"></div>
  </section>
  <section class="view" id="network">
    <div class="bar" id="netbar">
      <input id="say" placeholder="Say something to it and watch how it thinks" autocomplete="off">
      <button class="primary" id="go">Think</button>
      <button id="play" disabled>Play</button>
      <button id="livebtn" style="display:none">Live</button>
    </div>
    <div class="hint" style="bottom:112px">scroll to zoom · drag to move · hover a neuron · ← → step through tokens · double-click to reset</div>
    <canvas id="nc"></canvas>
    <div id="empty"></div>
    <div id="reply"></div>
    <div id="tokens"></div>
  </section>
</main>
<div id="tip"></div>
<script type="module">
const $ = s => document.querySelector(s);
const COLORS = { self: '#ffffff', maker: getVar('--accent'), person: getVar('--person'), stranger: getVar('--stranger'),
                 object: getVar('--object'), fact: getVar('--fact'), word: getVar('--word') };
function getVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
const tip = $('#tip');
let brainInfo = null, memLive = false;

function showTip(x, y, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + 'px';
  tip.style.top = Math.min(y + 14, innerHeight - h - 8) + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function rows(obj) {
  return Object.entries(obj).map(([k, v]) => `<div class="row"><span class="k">${esc(k)}</span><span>${esc(String(v))}</span></div>`).join('');
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// a canvas with zoom and pan; draw() paints in screen space using cam.sx / cam.sy
function setup(canvas, draw) {
  const cam = { x: 0, y: 0, k: 1, w: 0, h: 0, drag: null };
  const ctx = canvas.getContext('2d');
  cam.sx = x => x * cam.k + cam.x;
  cam.sy = y => y * cam.k + cam.y;
  cam.wx = x => (x - cam.x) / cam.k;
  cam.wy = y => (y - cam.y) / cam.k;
  function resize() {
    const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
    if (!r.width) return;
    cam.w = r.width; cam.h = r.height;
    canvas.width = r.width * d; canvas.height = r.height * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    draw();
  }
  new ResizeObserver(resize).observe(canvas);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const wx = cam.wx(mx), wy = cam.wy(my);
    cam.k = Math.min(12, Math.max(0.15, cam.k * Math.exp(-e.deltaY * 0.0016)));
    cam.x = mx - wx * cam.k; cam.y = my - wy * cam.k;
    draw();
  }, { passive: false });
  cam.ctx = ctx;
  return cam;
}

/* ---------- memory ---------- */
const mc = $('#mc');
const M = { nodes: [], edges: [], by: {}, active: new Set(), hover: null, heat: 1 };
const mcam = setup(mc, drawMemory);
let fitted = false;

$('#legend').innerHTML = [['maker', 'made it'], ['person', 'person'], ['stranger', 'face without a name'],
  ['object', 'thing'], ['fact', 'fact'], ['word', 'word']]
  .map(([k, t]) => `<span><i style="background:${COLORS[k]}"></i>${t}</span>`).join('');

async function loadMemory() {
  try {
    const d = await (await fetch('/api/memory')).json();
    memLive = d.live;
    const old = M.by, by = {};
    for (const n of d.nodes) {
      const o = old[n.id];
      if (o) { Object.assign(o, n); by[n.id] = o; continue; }
      by[n.id] = Object.assign(n, { x: 0, y: 0, vx: 0, vy: 0, fixed: false, fresh: true });
    }
    const edges = d.edges.filter(([a, b]) => by[a] && by[b]).map(([a, b, w]) => ({ a: by[a], b: by[b], w }));
    for (const e of edges) if (e.b.fresh) {
      e.b.x = e.a.x + (Math.random() - .5) * 80; e.b.y = e.a.y + (Math.random() - .5) * 80; e.b.fresh = false;
    }
    if (by.self) { by.self.x = 0; by.self.y = 0; by.self.fixed = true; }
    const changed = d.nodes.length !== M.nodes.length || edges.length !== M.edges.length;
    M.nodes = d.nodes.map(n => by[n.id]); M.edges = edges; M.by = by; M.active = new Set(d.active);
    if (changed) M.heat = 1;
    status();
  } catch (e) { /* the page stays as it was */ }
}

function simulate() {
  const N = M.nodes, E = M.edges;
  if (M.heat < 0.002 || !N.length) return false;
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b = N[j]; let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy + 30;
    const f = 2600 / d2; const d = Math.sqrt(d2); dx /= d; dy /= d;
    a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
  }
  for (const e of E) {
    const rest = e.a.id === 'self' ? 150 : 70;
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y; const d = Math.sqrt(dx * dx + dy * dy) + .01;
    const f = (d - rest) * 0.03 * (0.5 + e.w); dx /= d; dy /= d;
    e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
  }
  for (const n of N) {
    if (n.fixed) { n.vx = n.vy = 0; continue; }
    n.vx = (n.vx - n.x * 0.003) * 0.6 * M.heat; n.vy = (n.vy - n.y * 0.003) * 0.6 * M.heat;
    n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy));
  }
  M.heat *= 0.985;
  return true;
}

function fitMemory() {
  if (!M.nodes.length || !mcam.w) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const n of M.nodes) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); }
  const k = Math.min(2, 0.8 * Math.min(mcam.w / (x1 - x0 + 80), mcam.h / (y1 - y0 + 80)));
  mcam.k = k; mcam.x = mcam.w / 2 - (x0 + x1) / 2 * k; mcam.y = mcam.h / 2 - (y0 + y1) / 2 * k;
}

function neighbors(n) {
  const s = new Set([n]);
  for (const e of M.edges) { if (e.a === n) s.add(e.b); if (e.b === n) s.add(e.a); }
  return s;
}

function drawMemory() {
  const c = mcam.ctx, k = mcam.k, t = performance.now() / 1000;
  c.clearRect(0, 0, mcam.w, mcam.h);
  const near = M.hover ? neighbors(M.hover) : null;
  c.lineWidth = 1;
  for (const e of M.edges) {
    const hot = near && near.has(e.a) && near.has(e.b);
    c.strokeStyle = hot ? COLORS.maker : near ? '#1b1f25' : '#2c323b';
    c.beginPath(); c.moveTo(mcam.sx(e.a.x), mcam.sy(e.a.y)); c.lineTo(mcam.sx(e.b.x), mcam.sy(e.b.y)); c.stroke();
  }
  for (const n of M.nodes) {
    const x = mcam.sx(n.x), y = mcam.sy(n.y), r = (2.5 + 2.6 * n.size) * Math.sqrt(k);
    const dim = near && !near.has(n);
    c.globalAlpha = dim ? 0.25 : 1;
    c.fillStyle = COLORS[n.kind] || COLORS.object;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    if (n.kind === 'self') { c.strokeStyle = '#fff'; c.beginPath(); c.arc(x, y, r + 4, 0, 7); c.stroke(); }
    if (M.active.has(n.id)) {
      c.strokeStyle = COLORS.maker; c.lineWidth = 1.5;
      c.beginPath(); c.arc(x, y, r + 5 + 3 * Math.sin(t * 4), 0, 7); c.stroke(); c.lineWidth = 1;
    }
    const label = n.kind !== 'word' || k > 1.3 || (near && near.has(n));
    if (label) {
      c.fillStyle = n === M.hover ? '#fff' : dim ? '#4b5563' : '#aab1ba';
      c.font = `${n.kind === 'self' ? 600 : 400} ${n.kind === 'self' ? 13 : 11}px -apple-system, system-ui, sans-serif`;
      c.fillText(n.kind === 'self' ? n.label.toUpperCase() : n.label, x + r + 5, y + 4);
    }
  }
  c.globalAlpha = 1;
}

function nodeAt(mx, my) {
  let best = null, bd = 1e9;
  for (const n of M.nodes) {
    const r = (2.5 + 2.6 * n.size) * Math.sqrt(mcam.k) + 5;
    const d = Math.hypot(mcam.sx(n.x) - mx, mcam.sy(n.y) - my);
    if (d < r && d < bd) { best = n; bd = d; }
  }
  return best;
}

(function memoryMouse() {
  let drag = null, last = null;
  mc.addEventListener('mousedown', e => {
    const r = mc.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const n = nodeAt(mx, my);
    drag = n ? { node: n } : { pan: true }; last = [e.clientX, e.clientY]; mc.classList.add('dragging');
  });
  addEventListener('mouseup', () => { drag = null; mc.classList.remove('dragging'); });
  mc.addEventListener('mousemove', e => {
    const r = mc.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (drag && drag.pan) { mcam.x += e.clientX - last[0]; mcam.y += e.clientY - last[1]; }
    else if (drag && drag.node && drag.node.id !== 'self') {
      drag.node.x = mcam.wx(mx); drag.node.y = mcam.wy(my); drag.node.fixed = true; M.heat = Math.max(M.heat, .3);
    }
    last = [e.clientX, e.clientY];
    const n = drag ? (drag.node || null) : nodeAt(mx, my);
    M.hover = n;
    if (n) showTip(e.clientX, e.clientY, `<b>${esc(n.label)}</b>${rows(n.info || {})}`); else hideTip();
  });
  mc.addEventListener('mouseleave', () => { M.hover = null; hideTip(); });
  mc.addEventListener('dblclick', e => {
    const r = mc.getBoundingClientRect(), n = nodeAt(e.clientX - r.left, e.clientY - r.top);
    if (n) n.fixed = n.id === 'self'; else fitMemory();
  });
})();

/* ---------- neural network ---------- */
const nc = $('#nc');
const ncam = setup(nc, drawNet);
const N = { data: null, t: 0, hover: null, playing: null, live: false, liveTimer: null };
const COL = 64, ROW = 9;

function b64(s, Type) {
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return new Type(u.buffer);
}

function setNet(d, tokens = true) {
  const T = d.act ? b64(d.act, Uint8Array).length / (d.layers * d.groups) : 0;
  N.data = { T, L: d.layers, G: d.groups, width: d.width, said: d.said ?? T, words: d.tokens || [],
             act: b64(d.act, Uint8Array), scale: b64(d.scale, Float32Array), idx: b64(d.idx, Uint16Array) };
  if (tokens) { N.t = Math.min(N.t, T - 1); renderTokens(); } else N.t = 0;
  if (!N.fitted) fitNet();
  $('#empty').textContent = '';
  $('#play').disabled = T < 2;
  drawNet();
}

function fitNet() {
  const d = N.data; if (!d || !ncam.w) return;
  const W = (d.L - 1) * COL, H = (d.G - 1) * ROW;
  const k = Math.min((ncam.w - 120) / W, (ncam.h - 330) / H);
  ncam.k = k; ncam.x = (ncam.w - W * k) / 2; ncam.y = 160 + (ncam.h - 330 - H * k) / 2;
  N.fitted = true;
}

const at = (t, i, j) => N.data.act[(t * N.data.L + i) * N.data.G + j] / 255;
function top(t, i, m) {
  const G = N.data.G, a = [];
  for (let j = 0; j < G; j++) a.push(j);
  return a.sort((p, q) => at(t, i, q) - at(t, i, p)).slice(0, m);
}

function drawNet() {
  const c = ncam.ctx, d = N.data;
  c.clearRect(0, 0, ncam.w, ncam.h);
  if (!d) return;
  const t = N.t, k = ncam.k, r = Math.max(1.2, Math.min(5, 2.2 * Math.sqrt(k)));
  const X = i => ncam.sx(i * COL), Y = j => ncam.sy(j * ROW);
  const h = N.hover;
  c.save(); c.beginPath(); c.rect(0, 122, ncam.w, ncam.h - 122 - 132); c.clip();
  // links between the strongest neurons of neighbouring layers
  for (let i = 0; i < d.L - 1; i++) {
    const A = top(t, i, 7), B = top(t, i + 1, 7);
    for (const a of A) for (const b of B) {
      const s = Math.sqrt(at(t, i, a) * at(t, i + 1, b));
      const hot = h && ((h.i === i && h.j === a) || (h.i === i + 1 && h.j === b));
      c.strokeStyle = hot ? `rgba(245,180,0,${0.35 + 0.6 * s})` : `rgba(245,180,0,${(h ? 0.05 : 0.22) * s})`;
      c.lineWidth = hot ? 1.4 : 1;
      c.beginPath(); c.moveTo(X(i), Y(a)); c.lineTo(X(i + 1), Y(b)); c.stroke();
    }
  }
  for (let i = 0; i < d.L; i++) {
    let best = 0;
    for (let j = 1; j < d.G; j++) if (at(t, i, j) > at(t, i, best)) best = j;
    for (let j = 0; j < d.G; j++) {
      const v = at(t, i, j);
      c.fillStyle = j === best ? COLORS.maker : `rgba(215,219,224,${0.12 + 0.88 * v})`;
      c.beginPath(); c.arc(X(i), Y(j), h && h.i === i && h.j === j ? r + 2.5 : r, 0, 7); c.fill();
    }
    c.fillStyle = '#7d8590'; c.font = '11px -apple-system, system-ui, sans-serif'; c.textAlign = 'center';
    c.fillText(`L${i + 1}`, X(i), Y(0) - 12);
  }
  c.textAlign = 'left';
  c.restore();
  // a strip with every token: how strongly each layer worked on it
  if (d.T > 1) {
    const x0 = 18, y0 = 60, w = ncam.w - 36, hh = 28, cw = w / d.T, ch = hh / d.L;
    for (let tt = 0; tt < d.T; tt++) for (let i = 0; i < d.L; i++) {
      let m = 0; for (let j = 0; j < d.G; j++) m += at(tt, i, j);
      c.fillStyle = `rgba(215,219,224,${0.06 + 1.6 * m / d.G})`;
      c.fillRect(x0 + tt * cw, y0 + 24 + i * ch, Math.max(1, cw - 0.5), ch);
    }
    c.strokeStyle = COLORS.maker; c.strokeRect(x0 + t * cw, y0 + 23, Math.max(2, cw), hh + 2);
    N.strip = { x0, y0: y0 + 24, w, h: hh, cw };
  } else N.strip = null;
}

function neuronAt(mx, my) {
  const d = N.data; if (!d) return null;
  const i = Math.round(ncam.wx(mx) / COL), j = Math.round(ncam.wy(my) / ROW);
  if (i < 0 || i >= d.L || j < 0 || j >= d.G) return null;
  const dist = Math.hypot(ncam.sx(i * COL) - mx, ncam.sy(j * ROW) - my);
  return dist < Math.max(6, 4 * Math.sqrt(ncam.k)) ? { i, j } : null;
}

function neuronTip(n) {
  const d = N.data, t = N.t, g = d.width / d.G;
  const v = at(t, n.i, n.j), real = v * d.scale[t * d.L + n.i];
  const order = top(t, n.i, d.G).indexOf(n.j) + 1;
  const word = d.words[t] !== undefined ? JSON.stringify(d.words[t]) : '(live)';
  return `<b>Layer ${n.i + 1} · block ${n.j + 1}</b>` + rows({
    'neurons': `${n.j * g} to ${(n.j + 1) * g - 1}`,
    'strongest': `N${d.idx[(t * d.L + n.i) * d.G + n.j]}`,
    '|activation|': real.toFixed(3),
    'rank in layer': `${order} of ${d.G}`,
    'token': word,
  });
}

(function netMouse() {
  let drag = null, last = null;
  nc.addEventListener('mousedown', e => {
    const r = nc.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, s = N.strip;
    if (s && my >= s.y0 && my <= s.y0 + s.h && mx >= s.x0 && mx <= s.x0 + s.w) {
      select(Math.min(N.data.T - 1, Math.floor((mx - s.x0) / s.cw))); return;
    }
    drag = true; last = [e.clientX, e.clientY]; nc.classList.add('dragging');
  });
  addEventListener('mouseup', () => { drag = null; nc.classList.remove('dragging'); });
  nc.addEventListener('mousemove', e => {
    const r = nc.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (drag) { ncam.x += e.clientX - last[0]; ncam.y += e.clientY - last[1]; last = [e.clientX, e.clientY]; drawNet(); return; }
    const s = N.strip;
    if (s && my >= s.y0 && my <= s.y0 + s.h && mx >= s.x0 && mx <= s.x0 + s.w) {
      const tt = Math.min(N.data.T - 1, Math.floor((mx - s.x0) / s.cw));
      showTip(e.clientX, e.clientY, `<b>token ${tt + 1}</b>${esc(JSON.stringify(N.data.words[tt] || ''))}`);
      return;
    }
    const n = neuronAt(mx, my);
    if ((n && (!N.hover || n.i !== N.hover.i || n.j !== N.hover.j)) || (!n && N.hover)) { N.hover = n; drawNet(); }
    if (n) showTip(e.clientX, e.clientY, neuronTip(n)); else hideTip();
  });
  nc.addEventListener('mouseleave', () => { N.hover = null; hideTip(); drawNet(); });
  nc.addEventListener('dblclick', () => { fitNet(); drawNet(); });
})();

function select(t) {
  if (!N.data) return;
  N.t = Math.max(0, Math.min(N.data.T - 1, t));
  document.querySelectorAll('.tok').forEach((el, i) => el.classList.toggle('sel', i === N.t));
  const el = document.querySelectorAll('.tok')[N.t]; if (el) el.scrollIntoView({ block: 'nearest' });
  drawNet();
}

function renderTokens() {
  const d = N.data, box = $('#tokens');
  box.innerHTML = '';
  d.words.forEach((w, i) => {
    const el = document.createElement('span');
    const special = /^<\|.*\|>$/.test(w) || w === '\n';
    el.className = 'tok' + (i >= d.said ? ' reply' : '') + (special ? ' special' : '') + (i === N.t ? ' sel' : '');
    el.textContent = w.replace(/\n/g, '⏎');
    el.onmouseenter = () => { if (!N.playing) select(i); };
    el.onclick = () => select(i);
    box.appendChild(el);
  });
}

async function think() {
  const text = $('#say').value.trim(); if (!text) return;
  stopLive();
  const go = $('#go'); go.disabled = true; go.textContent = 'Thinking…';
  $('#reply').textContent = brainInfo && !brainInfo.loaded ? 'loading the cortex…' : '';
  try {
    const d = await (await fetch('/api/trace', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ text }) })).json();
    if (d.error) { $('#reply').textContent = d.error; return; }
    N.t = d.said; setNet(d); select(d.said);
    $('#reply').textContent = 'it thinks: ' + d.reply;
    brainInfo && (brainInfo.loaded = true); status();
  } catch (e) { $('#reply').textContent = 'could not reach the Machine'; }
  finally { go.disabled = false; go.textContent = 'Think'; }
}

function play() {
  if (N.playing) { clearInterval(N.playing); N.playing = null; $('#play').textContent = 'Play'; return; }
  if (N.t >= N.data.T - 1) select(0);
  $('#play').textContent = 'Pause';
  N.playing = setInterval(() => {
    if (N.t >= N.data.T - 1) return play();
    select(N.t + 1);
  }, 140);
}

function stopLive() {
  N.live = false; clearInterval(N.liveTimer); $('#livebtn').classList.remove('on');
}
function toggleLive() {
  if (N.live) return stopLive();
  N.live = true; $('#livebtn').classList.add('on'); $('#tokens').innerHTML = '';
  N.liveTimer = setInterval(async () => {
    try {
      const d = await (await fetch('/api/live')).json();
      if (!d.act) { $('#empty').textContent = 'no cortex to watch'; return; }
      d.tokens = undefined; setNet(Object.assign(d, { said: 1 }), false);
      $('#reply').textContent = d.thinking ? 'thinking: ' + d.text : 'resting';
    } catch (e) { stopLive(); }
  }, 150);
}

$('#go').onclick = think;
$('#play').onclick = play;
$('#livebtn').onclick = toggleLive;
$('#say').addEventListener('keydown', e => { if (e.key === 'Enter') think(); });
addEventListener('keydown', e => {
  if (document.activeElement === $('#say') || !N.data) return;
  if (e.key === 'ArrowRight') select(N.t + 1);
  if (e.key === 'ArrowLeft') select(N.t - 1);
  if (e.key === ' ') { e.preventDefault(); play(); }
});

/* ---------- shell ---------- */
document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === tab.dataset.view));
  hideTip();
  if (tab.dataset.view === 'network') { fitNet(); drawNet(); }
});

function status() {
  const net = $('#network').classList.contains('on');
  const live = memLive ? '<span class="dot live"></span>awake' : '<span class="dot"></span>asleep, reading its memory file';
  const b = brainInfo;
  const model = b && b.model ? ` · cortex ${b.model}${b.layers ? `, ${b.layers} layers × ${b.width} neurons` : ''}` : ' · no cortex model';
  $('#status').innerHTML = live + `${net ? model : ` · ${M.nodes.length - 1} memories`}`;
}

async function init() {
  await loadMemory();
  for (let i = 0; i < 400 && simulate(); i++);
  fitMemory(); fitted = true; drawMemory();
  try { brainInfo = await (await fetch('/api/brain')).json(); } catch (e) {}
  if (brainInfo && brainInfo.live) $('#livebtn').style.display = '';
  $('#empty').textContent = brainInfo && brainInfo.model ? 'say something above to see how it thinks'
                                                         : 'no cortex model. Run: python -m the_machine download';
  status();
  setInterval(loadMemory, memLive ? 2000 : 10000);
  (function frame() {
    const moved = simulate();
    if (moved || M.active.size || M.hover) drawMemory();
    requestAnimationFrame(frame);
  })();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', status));
init();
</script>
</body>
</html>
