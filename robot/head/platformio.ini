; The Machine's head: an ESP32 with two servos, driven over WiFi or USB.
;   pio run -e sim      build for the Wokwi simulator
;   pio run -e head -t upload   build and flash the real board

[platformio]
default_envs = sim

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = madhephaestus/ESP32Servo@^3.0.6

[env:sim]
build_flags = -DWIFI_SSID=\"Wokwi-GUEST\" -DWIFI_PASS=\"\" -DWIFI_CHANNEL=6

[env:head]
; WiFi name and password come from src/secrets.h (copy secrets.example.h)

[env:head-ota]
; later updates over WiFi, once the head is on your network
upload_protocol = espota
upload_port = machine-head.local
