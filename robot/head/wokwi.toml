[wokwi]
version = 1
firmware = '.pio/build/sim/firmware.bin'
elf = '.pio/build/sim/firmware.elf'
# the serial port, reachable from the computer at rfc2217://localhost:4000
rfc2217ServerPort = 4000

# The Machine talks to the simulated head at localhost:7351
[[net.forward]]
from = "localhost:7351"
to = "target:7351"
